name: Build P5M for Windows x86_64

on:
  workflow_dispatch:
  push:
    branches: [windows]
    tags: ['win-v*']

jobs:
  build-win_x64:
    name: Build P5M win_x64
    runs-on: windows-latest
    env:
      CC: clang-cl.exe
      CXX: clang-cl.exe
      VULKAN_SDK: C:\VulkanSDK\
      triplet: x64-windows
      # vcpkg 2026.07.29: the older baseline fetched msys2 packages that the
      # mirrors no longer carry (pkgconf 2.1.0).
      vcpkg_baseline: c76c06644034521fb761a39f8f52d8e87d1103d5
      dep_folder: deps
      libplacebo_tag: v7.360.1
      sdl2_compat_tag: 2.32.64
      vulkan_sdk_version: 1.4.363.0
      # The runners moved to CMake 4, which refuses projects that still ask
      # for CMake < 3.5 (json-c in this vcpkg baseline, among others). vcpkg
      # scrubs the environment, so the variable has to be let through.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      VCPKG_KEEP_ENV_VARS: CMAKE_POLICY_VERSION_MINIMUM
      # Built ports are kept between runs (see the cache steps around vcpkg).
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-binary-cache,readwrite

    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set vcpkg installed dir
        run: |
          echo "VCPKG_INSTALLED_DIR=${{ github.workspace }}\build\vcpkg_installed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Vulkan
        run: |
          $ProgressPreference = 'SilentlyContinue'
          # Pinned: "latest" moves under us, and Windows PowerShell 5.1 needs
          # -UseBasicParsing or Invoke-WebRequest fails with a null reference.
          $ver = "${{ env.vulkan_sdk_version }}"
          echo Version $ver
          Invoke-WebRequest -UseBasicParsing -Uri "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe" -OutFile VulkanSDK.exe
          echo Downloaded
          .\VulkanSDK.exe --root ${{ env.VULKAN_SDK }}  --accept-licenses --default-answer --confirm-command install

      - name: Set up Ninja
        run: choco install ninja

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: 18

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.*"
          host: 'windows'
          target: 'desktop'
          modules: 'qtwebengine qtpositioning qtwebchannel qtwebsockets qtserialport'

      - name: Install pip dependencies
        run: |
          ${{ env.pythonLocation }}\python.exe -m pip install --upgrade pip
          ${{ env.pythonLocation }}\python.exe -m pip install --upgrade setuptools wheel
          ${{ env.pythonLocation }}\python.exe -m pip install --user --upgrade scons protobuf grpcio-tools pyinstaller
          ${{ env.pythonLocation }}\python.exe -m pip install --user --upgrade meson
          ${{ env.pythonLocation }}\python.exe -c 'import google.protobuf; print(google.protobuf.__file__)'

      - name: Setup ffmpeg
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip" -OutFile ".\ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip"
          Expand-Archive -LiteralPath "ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip" -DestinationPath "."
          Rename-Item "ffmpeg-n7.1-latest-win64-gpl-shared-7.1" "${{ env.dep_folder }}"

      - name: Setup sdl2-compat
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -UseBasicParsing -Uri https://github.com/libsdl-org/sdl2-compat/releases/download/release-${{ env.sdl2_compat_tag }}/sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64.zip -OutFile sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64.zip
          Expand-Archive -Force -LiteralPath "sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64.zip" -DestinationPath ".\sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64"
          Get-ChildItem -Path ".\sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64\*" -Include "*.dll" | Copy-Item -Force -Destination "${{ env.dep_folder }}\bin"

      - name: Build SPIRV-Cross
        run: |
          git clone https://github.com/KhronosGroup/SPIRV-Cross.git
          cd SPIRV-Cross
          cmake `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}\${{ env.dep_folder }}" `
          -DSPIRV_CROSS_SHARED=ON `
          -S . `
          -B build `
          -G Ninja
          cmake --build build --config Release
          cmake --install build

      - name: Setup shaderc (from the Vulkan SDK)
        # The Google build link this step used to read is gone (NoSuchKey);
        # the Vulkan SDK ships the same shaderc_shared, so point pkg-config
        # (libplacebo's dependency('shaderc')) at it.
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\${{ env.dep_folder }}\lib\pkgconfig" | Out-Null
          Copy-Item "${{ env.VULKAN_SDK }}Bin\shaderc_shared.dll" "${{ github.workspace }}\${{ env.dep_folder }}\bin\"
          $sdk = "${{ env.VULKAN_SDK }}".TrimEnd('\').Replace('\', '/')
          $pc = "prefix=$sdk`nincludedir=`${prefix}/Include`nlibdir=`${prefix}/Lib`n`nName: shaderc`nDescription: shaderc from the Vulkan SDK`nVersion: 2025.2.0`nLibs: -L`${libdir} -lshaderc_shared`nCflags: -I`${includedir}`n"
          [System.IO.File]::WriteAllText("${{ github.workspace }}\${{ env.dep_folder }}\lib\pkgconfig\shaderc.pc", $pc)
          Get-Content "${{ github.workspace }}\${{ env.dep_folder }}\lib\pkgconfig\shaderc.pc"

      - name: Make build directory
        run: |
          mkdir build

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-binary-cache
          key: vcpkg-bin-${{ env.vcpkg_baseline }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: vcpkg-bin-${{ env.vcpkg_baseline }}-${{ hashFiles('vcpkg.json') }}-

      - name: Make vcpkg binary cache directory
        run: New-Item -ItemType Directory -Force -Path vcpkg-binary-cache | Out-Null

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.vcpkg_baseline }}
          runVcpkgInstall: true
          vcpkgJsonGlob: "vcpkg.json"

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: vcpkg-binary-cache
          key: vcpkg-bin-${{ env.vcpkg_baseline }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}

      - name: Build libplacebo
        run: |
          git clone --recursive https://github.com/haasn/libplacebo.git
          cd libplacebo
          git checkout --recurse-submodules ${{ env.libplacebo_tag }}
          meson setup `
          --prefix "${{ github.workspace }}\${{ env.dep_folder }}" `
          --native-file ../meson.ini `
          "--pkg-config-path=['${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\lib\pkgconfig','${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\share\pkgconfig','${{ github.workspace }}\${{ env.dep_folder }}\lib\pkgconfig']" `
          "--cmake-prefix-path=['${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}', '${{ env.VULKAN_SDK }}', '${{ github.workspace }}\${{ env.dep_folder }}']" `
          -Dc_args="/I ${{ env.VULKAN_SDK }}Include" `
          -Dcpp_args="/I ${{ env.VULKAN_SDK }}Include" `
          -Dc_link_args="/LIBPATH:${{ env.VULKAN_SDK }}Lib" `
          -Dcpp_link_args="/LIBPATH:${{ env.VULKAN_SDK }}Lib" `
          -Ddemos=false `
          ./build
          ninja -C./build
          ninja -C./build install

      - name: Apply Patches
        run: |
          git apply --ignore-whitespace --verbose --directory=third-party/gf-complete/ scripts/windows-vc/gf-complete.patch

      - name: Work out the version
        # Tag win-v0.1.0-alpha.1 -> 0.1.0-alpha.1; other builds carry the commit.
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}" -replace '^win-v', '' }
          else { $v = "0.1.0-alpha.1+" + "${{ github.sha }}".Substring(0, 8) }
          echo "P5M_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "Version $v"

      - name: Configure P5M
        run: |
          cmake `
          -S . `
          -B build `
          -G Ninja `
          -DCMAKE_TOOLCHAIN_FILE:STRING="vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=TRUE `
          -DCMAKE_BUILD_TYPE=Release `
          -DCHIAKI_ENABLE_CLI=OFF `
          -DP5M_WIN_VERSION="${env:P5M_VERSION}" `
          -DCHIAKI_GUI_ENABLE_SDL_GAMECONTROLLER=ON `
          -DCHIAKI_ENABLE_STEAMDECK_NATIVE=OFF `
          -DPYTHON_EXECUTABLE="${{ env.pythonLocation }}\python.exe" `
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}\${{ env.dep_folder }};${{ env.VULKAN_SDK }}"

      - name: Build P5M
        run: |
          cmake --build build --config Release --clean-first --target chiaki

      - name: Prepare Qt deployment package
        # Every DLL the dependencies installed, instead of a list of exact
        # names: vcpkg renames them between baselines (lcms2 -> lcms2-2...).
        run: |
          mkdir P5M-Win
          cp build\gui\chiaki.exe P5M-Win\P5M.exe
          cp build\third-party\cpp-steam-tools\cpp-steam-tools.dll P5M-Win
          cp scripts\qtwebengine_import.qml gui\src\qml\
          Copy-Item "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\*.dll" P5M-Win
          Copy-Item "${{ github.workspace }}\${{ env.dep_folder }}\bin\*.dll" P5M-Win
          Get-ChildItem P5M-Win -Filter *.dll | ForEach-Object { $_.Name }
          cp COPYING P5M-Win\LICENSE.txt
          windeployqt.exe --no-translations --qmldir=gui\src\qml --release P5M-Win\P5M.exe

      - name: Package P5M
        run: |
          $VERSION = "${env:P5M_VERSION}" -replace '\+', '-'
          $RELEASE_PACKAGE_FILE = "P5M-$VERSION-win_x64-portable.zip"
          # 7-Zip writes forward slashes; Compress-Archive on PowerShell 5.1
          # writes backslashes that extractors outside Windows choke on.
          7z a -tzip -mx=7 $RELEASE_PACKAGE_FILE P5M-Win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release_filepath = Get-ChildItem $RELEASE_PACKAGE_FILE | %{$_[0].FullName}
          echo "RELEASE_PACKAGE_PATH=$release_filepath" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Smoke test (open the app, screenshot, logs)
        # No PS5 here: this only shows whether P5M starts, draws its UI and
        # stays up with each renderer on the runner's basic display adapter.
        continue-on-error: true
        env:
          QT_FORCE_STDERR_LOGGING: "1"
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("smoke\$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          foreach ($backend in @('vulkan', 'd3d11')) {
            New-Item -Path 'HKCU:\Software\P5M\P5M\settings' -Force | Out-Null
            Set-ItemProperty -Path 'HKCU:\Software\P5M\P5M\settings' -Name 'render_backend' -Value $backend
            $p = Start-Process -FilePath "P5M-Win\P5M.exe" -PassThru `
                   -RedirectStandardError "smoke\$backend-stderr.txt" -RedirectStandardOutput "smoke\$backend-stdout.txt"
            Start-Sleep -Seconds 25
            Shot $backend
            if ($p.HasExited) { $state = "exited with code $($p.ExitCode)" } else { $state = "running"; Stop-Process -Id $p.Id -Force }
            "$backend : $state" | Tee-Object -FilePath smoke\result.txt -Append
            Start-Sleep -Seconds 3
          }
          if (Test-Path "$env:APPDATA\P5M") { Copy-Item -Recurse "$env:APPDATA\P5M" smoke\appdata }

      - name: Upload smoke test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P5M-smoke-test
          path: smoke
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload P5M artifact
        uses: actions/upload-artifact@v4
        with:
          name: P5M-win_x64-portable
          path: ${{ env.RELEASE_PACKAGE_PATH }}
          if-no-files-found: error
          retention-days: 14
